name: Deploy via FTP (Locaweb)

on:
  push:
    branches: [main]
    paths: ['html-version/**']
  pull_request:
    paths:
      - 'html-version/**'
      - '.github/workflows/main.yml'
      - 'scripts/publicacao.py'
      - 'tests/test_publicacao.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('auditoria-pr-{0}', github.event.number) || 'locaweb-producao' }}
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://tudobom.com.br

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Testar registro sem FTP
        run: python3 -m unittest discover -s tests -p test_publicacao.py -v
      - name: Preparar registro histórico
        run: python3 scripts/publicacao.py prepare
      - name: FTP Deploy Locaweb
        if: github.event_name == 'push'
        uses: locaweb/ftp-deploy@a69dfe5b26c55007658dce15a17917250282f9cc # v1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: html-version
          remoteDir: web
      - name: Capturar produção e confirmar PDFs publicados
        if: github.event_name == 'push'
        run: python3 scripts/publicacao.py capture
      - name: Salvar histórico permanente no Git
        if: github.event_name == 'push'
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          git add historico-publicacoes/
          git commit -m "chore: registra publicação ${{ github.run_id }}"
          git push origin HEAD:main
